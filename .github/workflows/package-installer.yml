name: GE-155 package installer (manual)
# Manual only (workflow_dispatch): run it ONLY with the repository owner's explicit authorization.
# Nothing here touches game files; the fixtures are synthetic. Executables are uploaded as a short-lived
# workflow artifact for testing and are never committed to the repository.
on:
  workflow_dispatch:
  # NOTE: workflow_dispatch only works once this file is on the default branch. The authorized validation run
  # (run 46152652111) was started by a temporary branch push trigger, removed afterwards: re-add
  #   push: {branches: [grok/groove-package-validator], paths: [".github/workflows/package-installer.yml"]}
  # (and only with the owner's explicit authorization) or run it after the workflow reaches the default branch.
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]  # ubuntu-latest (26.04) has no Python 3.9
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install jsonschema
      - name: Unit tests (exact counts)
        run: python tests/package/run_all.py test-results.json
      - name: Simulated SD validation
        run: python tools/groove_sd_sim.py --report sd-sim-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results.json
            sd-sim-report.json
          retention-days: 14

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and validate (tools/windows/build_windows.ps1)
        shell: pwsh
        run: ./tools/windows/build_windows.ps1
      - name: Smoke test the frozen CLI
        shell: pwsh
        run: |
          ./build-out/dist/GrooveInstall.exe --json validate tests/package/fixtures/valid/synthetic-a-1.0.0.groove
          if ($LASTEXITCODE -ne 0) { throw "frozen CLI validate failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: GrooveInstaller-windows-DRAFT
          path: |
            build-out/dist/GrooveInstaller.exe
            build-out/dist/GrooveInstall.exe
            build-out/SHA256SUMS.txt
            build-out/sd-sim-report.json
            build-out/test-results.json
          retention-days: 7
